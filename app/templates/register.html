
{% extends "base.html" %}
{% block title %}Register – InventoryPro{% endblock %}
{% block content %}
<div class="auth-wrapper">
    <div class="auth-card card">
        <div class="card-body">
            <div class="auth-icon register">
                <i class="bi bi-person-plus-fill"></i>
            </div>
            <h3>Create your account</h3>
            <form method="POST">
                <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="Choose a username"
                           required minlength="3" autocomplete="username">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" name="email" class="form-control"
                           placeholder="you@example.com"
                           required autocomplete="email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Min 6 characters"
                           required minlength="6" autocomplete="new-password">
                </div>
                <button type="submit" class="btn btn-success w-100 mt-2">
                    <i class="bi bi-check-circle"></i> Create Account
                </button>
            </form>
            <p class="text-center mt-3 mb-1" style="font-size:.875rem;color:var(--text-secondary);">
                Already registered?
                <a href="{{ url_for('auth.login') }}" style="font-weight:600;">Log in</a>
            </p>
            <p class="text-center mb-0" style="font-size:.78rem;color:var(--text-muted);">
                <i class="bi bi-info-circle"></i>
                First registered user becomes <strong>Admin</strong>.
            </p>
        </div>
    </div>
</div>
{% endblock %}
