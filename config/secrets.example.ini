[app]
secret_key = CHANGE-ME-to-a-long-random-string
debug = false
host = 0.0.0.0
port = 5000

[database]
; Active driver: sqlite  (change to "postgresql" when ready)
type = sqlite
sqlite_path = data/inventory.db

; ── PostgreSQL (uncomment when ready) ──
; type = postgresql
; host = localhost
; port = 5432
; name = inventory_db
; user = inventory_user
; password = your_secure_password_here

[uploads]
max_file_size_mb = 16
allowed_extensions = png,jpg,jpeg,gif,webp
upload_folder = app/static/uploads